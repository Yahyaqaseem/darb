version: '3.8'

services:
  postgres:
    image: postgis/postgis:15-3.3
    container_name: darb-postgres
    environment:
      POSTGRES_USER: darb_user
      POSTGRES_PASSWORD: darb_password
      POSTGRES_DB: darb_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: darb-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  api:
    build:
      context: ./services/api
      dockerfile: Dockerfile
    container_name: darb-api
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=darb_user
      - DB_PASS=darb_password
      - DB_NAME=darb_db
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - postgres
      - redis
    volumes:
      - ./services/api:/usr/src/app
      - /usr/src/app/node_modules
    restart: unless-stopped

  worker:
    build:
      context: ./services/workers
      dockerfile: Dockerfile
    container_name: darb-worker
    environment:
      - NODE_ENV=development
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=darb_user
      - DB_PASS=darb_password
      - DB_NAME=darb_db
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - postgres
      - redis
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
