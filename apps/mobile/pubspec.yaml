name: darb_mobile
description: "DARB دَرْب - Production-Grade Cross-Platform Navigation Platform"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.6
  
  # Core
  dio: ^5.4.3+1
  get_it: ^7.7.0
  injectable: ^2.4.1
  shared_preferences: ^2.2.3
  flutter_secure_storage: ^9.2.1
  equatable: ^2.0.5
  dartz: ^0.10.1
  
  # State Management
  flutter_bloc: ^8.1.5
  
  # Routing
  go_router: ^14.1.4
  
  # Map & Navigation
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  geolocator: ^11.0.0
  flutter_compass: ^0.7.0
  
  # Realtime & Sockets
  web_socket_channel: ^3.0.0
  
  # UI & Styling
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  flutter_animate: ^4.5.0
  
  # Firebase
  firebase_core: ^3.1.0
  firebase_messaging: ^15.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.9
  injectable_generator: ^2.6.1
  json_serializable: ^6.9.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/images/
    - assets/map_styles/
